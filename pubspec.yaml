name: premiere_tracker
description: "Premiere Tracker - Busca películas y series y consulta sus estrenos."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado (MVC con ChangeNotifier)
  provider: ^6.1.2
  # Peticiones HTTP a TMDB y TVMaze
  http: ^1.2.0
  # Almacenamiento local por usuario (JSON en el equipo)
  shared_preferences: ^2.3.2
  # Cifrado SHA-256 de los PIN de usuario
  crypto: ^3.0.3
  # Exportar/importar copias de seguridad .json
  file_picker: ^10.3.3
  # Enlaces clicables (créditos de TVMaze)
  url_launcher: ^6.3.0
  calendar_view: 2.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generación del icono de lanzamiento (mismo .ico que Windows)
  flutter_launcher_icons: ^0.14.4

# Fijar la implementación Android de shared_preferences a 2.4.28: la 2.5.x
# (publicada el 17-10-2026 con «Pigeon JNI») falla en Android real con
# NoSuchMethodError al leer preferencias (spinner eterno en Usuarios y
# usuarios que no se creaban). Se puede quitar cuando publique una corrección.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    # El .env NO se empaqueta en la app: la clave de TMDB la pone cada
    # usuario desde la app (se guarda en preferencias privadas).
    - assets/images/

# Icono de lanzamiento: PNG de 256x256 extraído del .ico de Windows para
# que el móvil muestre idéntico icono y sin pixelar (flutter_launcher_icons
# decodifica la primera imagen del .ico, que es de 16x16). Solo Android.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "tool/app_icon_256.png"
